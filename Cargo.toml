[workspace]
resolver = "3"
members = [
    "crates/wallet-core",
    "crates/chain-api",
    "crates/crypto-runtime",
    "crates/key-lifecycle",
    "crates/hd-key-backend",
    "crates/chain-bitcoin",
    "crates/chain-ethereum",
    "crates/chain-solana",
    "crates/firmware-budget",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.firmware]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 1
strip = "none"
panic = "abort"
overflow-checks = true
incremental = false
