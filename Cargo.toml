[workspace]
resolver = "3"
members = [
    "crates/wallet-core",
    "crates/chain-api",
    "crates/crypto-runtime",
    "crates/hd-key-backend",
    "crates/chain-bitcoin",
    "crates/chain-ethereum",
    "crates/chain-solana",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
