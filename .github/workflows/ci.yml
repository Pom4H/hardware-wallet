name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep only the newest automatic verification for each ref.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  tools:
    timeout-minutes: 20
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Test hardware sizing tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  rust:
    timeout-minutes: 20
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Format
        run: cargo +1.98.0 fmt --all -- --check

      - name: Clippy
        run: cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo +1.98.0 test --locked --workspace

      - name: Check no_std crates
        run: cargo +1.98.0 check --locked --workspace --no-default-features

  msrv:
    timeout-minutes: 20
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Check workspace on Rust 1.85
        run: cargo +1.85.0 check --locked --workspace --no-default-features
