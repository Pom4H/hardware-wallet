name: Fix hardware budget probe once

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix and format probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/firmware-budget/src/main.rs')
          source = path.read_text()
          source = source.replace(
              '    const fn new(selector: u8) -> Self {',
              '    fn new(selector: u8) -> Self {',
              1,
          )
          path.write_text(source)
          PY
          cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/firmware-budget/src/main.rs
          git commit -m "Fix and format hardware budget probe"
          git push
