name: Finalize virtual wallet board once

on:
  push:
    paths:
      - .github/workflows/finalize-virtual-board-once.yml
      - crates/firmware-budget/src/virtual_device.rs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-virtual-wallet-board-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Apply minimal firmware integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo_path = Path('crates/firmware-budget/Cargo.toml')
          cargo = cargo_path.read_text()
          cargo = cargo.replace(
              'firmverse-probe = ["embedded-probe", "dep:cortex-m-semihosting"]',
              'firmverse-probe = ["embedded-probe"]',
          )
          cargo = cargo.replace(
              'cortex-m-semihosting = { version = "0.3.7", optional = true }\n',
              '',
          )
          cargo_path.write_text(cargo)

          main_path = Path('crates/firmware-budget/src/main.rs')
          source = main_path.read_text()
          import_anchor = 'use panic_halt as _;\n'
          module = '\n#[cfg(feature = "firmverse-probe")]\nmod virtual_device;\n'
          if module.strip() not in source:
              if import_anchor not in source:
                  raise SystemExit('panic import anchor missing')
              source = source.replace(import_anchor, import_anchor + module, 1)

          old = '''#[entry]
          fn main() -> ! {
              let selector = black_box(0x5a_u8);

              #[cfg(feature = "firmverse-probe")]
              let success = firmverse_self_test(selector);

              #[cfg(not(feature = "firmverse-probe"))]
              {
                  let result = exercise(selector);
                  black_box(result);
              }

              #[cfg(feature = "firmverse-probe")]
              cortex_m_semihosting::debug::exit(if success {
                  cortex_m_semihosting::debug::EXIT_SUCCESS
              } else {
                  cortex_m_semihosting::debug::EXIT_FAILURE
              });

              loop {
                  cortex_m::asm::nop();
              }
          }
          '''
          new = '''#[entry]
          fn main() -> ! {
              let selector = black_box(0x5a_u8);

              #[cfg(feature = "firmverse-probe")]
              {
                  black_box(virtual_device::run(selector));
                  firmverse_done();
              }

              #[cfg(not(feature = "firmverse-probe"))]
              {
                  let result = exercise(selector);
                  black_box(result);
              }

              loop {
                  cortex_m::asm::nop();
              }
          }

          #[cfg(feature = "firmverse-probe")]
          #[unsafe(no_mangle)]
          #[inline(never)]
          pub extern "C" fn firmverse_done() {
              cortex_m::asm::nop();
          }
          '''
          if old not in source:
              if 'black_box(virtual_device::run(selector));' not in source:
                  raise SystemExit('firmware entrypoint anchor changed unexpectedly')
          else:
              source = source.replace(old, new, 1)
          main_path.write_text(source)

          build_path = Path('crates/firmware-budget/build.rs')
          build = build_path.read_text()
          old_write = '''    fs::write(output.join("memory.x"), include_bytes!("memory.x"))
              .expect("write generic probe memory layout");
          '''
          new_write = '''    if env::var_os("CARGO_FEATURE_FIRMVERSE_PROBE").is_some() {
              fs::write(
                  output.join("memory.x"),
                  b"MEMORY\\n{\\n  FLASH : ORIGIN = 0x10000000, LENGTH = 1024K\\n  RAM   : ORIGIN = 0x38000000, LENGTH = 256K\\n}\\n\\n_stack_start = ORIGIN(RAM) + LENGTH(RAM);\\n",
              )
              .expect("write Firmverse secure memory layout");
          } else {
              fs::write(output.join("memory.x"), include_bytes!("memory.x"))
                  .expect("write generic probe memory layout");
          }
          '''
          if old_write not in build:
              if 'write Firmverse secure memory layout' not in build:
                  raise SystemExit('build.rs memory anchor changed unexpectedly')
          else:
              build = build.replace(old_write, new_write, 1)
          build_path.write_text(build)
          PY

      - name: Install pinned Rust Cortex-M toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: thumbv8m.main-none-eabi
          components: rustfmt, llvm-tools-preview

      - name: Install Firmverse runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm gdb-multiarch

      - name: Format and build real wallet firmware
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 build \
            --locked \
            --profile firmware \
            --target thumbv8m.main-none-eabi \
            -p hardware-wallet-firmware-budget \
            --features firmverse-probe

      - name: Execute wallet on verified Firmverse backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/firmverse reports/firmverse
          git clone https://github.com/Pom4H/firmverse.git /tmp/firmverse
          git -C /tmp/firmverse checkout 819c9bd3716f73a3973ecf94033e92434ebef587
          host="$(rustc +1.98.0 -vV | sed -n 's/^host: //p')"
          llvm_root="$(rustc +1.98.0 --print sysroot)/lib/rustlib/${host}/bin"
          python3 /tmp/firmverse/tools/cortex_m_probe.py \
            --elf target/thumbv8m.main-none-eabi/firmware/hardware-wallet-firmware-budget \
            --target thumbv8m.main-none-eabi \
            --machine mps2-an505 \
            --cpu cortex-m33 \
            --ram-origin 0x38000000 \
            --ram-length 262144 \
            --flash-origin 0x10000000 \
            --flash-length 1048576 \
            --done-symbol firmverse_done \
            --device-trace-symbol firmverse_device_trace \
            --required-device-capabilities 0x1f \
            --stack-limit-bytes 32768 \
            --timeout-seconds 120 \
            --output-dir reports/firmverse \
            --llvm-nm "$llvm_root/llvm-nm" \
            --llvm-size "$llvm_root/llvm-size"

      - name: Assert virtual board evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('reports/firmverse/firmverse-report.json').read_text())
          trace = report['device_trace']
          assert report['status'] == 'pass', report
          assert trace['status'] == 'pass', trace
          assert trace['capabilities'] == 0x1f, trace
          assert trace['button_events'] == 3, trace
          assert trace['display_frames'] == 2, trace
          assert trace['display_digest'] != 0, trace
          assert trace['trng_bytes'] == 32, trace
          assert trace['trng_digest'] != 0, trace
          assert trace['storage_commits'] == 2, trace
          assert trace['storage_generation'] == 2, trace
          assert trace['storage_digest'] != 0, trace
          assert trace['secure_element_ops'] == 1, trace
          assert trace['secure_element_digest'] != 0, trace
          assert trace['failure_code'] == 0, trace
          PY

      - name: Verify repository gates
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py'
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace
          cargo +1.98.0 check --locked --workspace --no-default-features

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/firmware-budget
          git diff --cached --quiet && exit 0
          git commit -m "Run wallet firmware on deterministic virtual hardware"
          git pull --rebase origin main
          git push origin main

      - name: Upload execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wallet-virtual-board
          path: reports/firmverse
          if-no-files-found: error
