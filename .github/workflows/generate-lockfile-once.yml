name: Generate Cargo lockfile once

on:
  push:

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          rm .github/workflows/generate-lockfile-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock .github/workflows/generate-lockfile-once.yml
          git commit -m "Lock Rust dependencies"
          git push
