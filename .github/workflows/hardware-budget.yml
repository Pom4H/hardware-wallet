name: Hardware budget

on:
  push:
    paths:
      - .github/workflows/hardware-budget.yml
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - hardware-budget.toml
      - mcu-requirements.toml
      - mcu-candidate.example.toml
      - tools/hardware_budget.py
      - tools/mcu_candidate.py
      - crates/wallet-core/**
      - crates/chain-api/**
      - crates/crypto-runtime/**
      - crates/key-lifecycle/**
      - crates/hd-key-backend/**
      - crates/chain-bitcoin/**
      - crates/chain-ethereum/**
      - crates/chain-solana/**
      - crates/firmware-budget/**
  pull_request:
    paths:
      - .github/workflows/hardware-budget.yml
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - hardware-budget.toml
      - mcu-requirements.toml
      - mcu-candidate.example.toml
      - tools/hardware_budget.py
      - tools/mcu_candidate.py
      - crates/wallet-core/**
      - crates/chain-api/**
      - crates/crypto-runtime/**
      - crates/key-lifecycle/**
      - crates/hd-key-backend/**
      - crates/chain-bitcoin/**
      - crates/chain-ethereum/**
      - crates/chain-solana/**
      - crates/firmware-budget/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabi
          - thumbv8m.main-none-eabi

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Rust target and LLVM tools
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Link the complete trusted-core probe
        run: >-
          cargo +1.98.0 build
          --locked
          --profile firmware
          --target "${{ matrix.target }}"
          -p hardware-wallet-firmware-budget
          --features embedded-probe

      - name: Calculate MCU memory requirements
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host="$(rustc +1.98.0 -vV | sed -n 's/^host: //p')"
          llvm_size="$(rustc +1.98.0 --print sysroot)/lib/rustlib/${host}/bin/llvm-size"
          elf="target/${TARGET}/firmware/hardware-wallet-firmware-budget"
          output="reports/${TARGET}"
          test -x "$llvm_size"
          test -f "$elf"
          mkdir -p "$output"
          python3 tools/hardware_budget.py \
            --config hardware-budget.toml \
            --elf "$elf" \
            --llvm-size "$llvm_size" \
            --target "$TARGET" \
            --json "$output/budget.json" \
            --markdown "$output/budget.md"
          cp "$elf" "$output/probe.elf"
          cat "$output/budget.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the MCU selection gate
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          output="reports/${TARGET}"
          python3 tools/mcu_candidate.py \
            --requirements mcu-requirements.toml \
            --budget "$output/budget.json" \
            --candidate mcu-candidate.example.toml \
            --json "$output/example-candidate.json" \
            --markdown "$output/example-candidate.md"
          cat "$output/example-candidate.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload budget evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardware-budget-${{ matrix.target }}
          path: reports/${{ matrix.target }}
          if-no-files-found: error
