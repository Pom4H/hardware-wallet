name: Browser wallet firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: thumbv6m-none-eabi
          components: llvm-tools-preview
      - name: Build reducer-driven Firmverse demo firmware
        run: bash tools/build_browser_wallet_demo.sh
      - name: Check Intel HEX contains the Firmverse SRAM vector table
        run: |
          grep -q '^:.*1FFF' demos/browser-wallet/dist/wallet-demo.hex
          test -s demos/browser-wallet/dist/wallet-demo.elf
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-wallet-browser-demo
          path: demos/browser-wallet/dist
          if-no-files-found: error
          retention-days: 14
