name: Maintenance one-shot

on:
  push:
    paths:
      - .github/workflows/maintenance-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply semantic fixes
        shell: python
        run: |
          from pathlib import Path

          lib = Path('crates/chain-ethereum/src/lib.rs')
          text = lib.read_text()
          text = text.replace(
              'parse_typed_list(raw, EIP1559_SIGNED_FIELDS)?',
              'parse_typed_list::<EIP1559_SIGNED_FIELDS>(raw)?',
          )
          text = text.replace(
              'parse_typed_list(unsigned.as_slice(), EIP1559_UNSIGNED_FIELDS)?',
              'parse_typed_list::<EIP1559_UNSIGNED_FIELDS>(unsigned.as_slice())?',
          )
          text = text.replace(
              'parse_typed_list(bytes, EIP1559_UNSIGNED_FIELDS).expect("fixture parses")',
              'parse_typed_list::<EIP1559_UNSIGNED_FIELDS>(bytes).expect("fixture parses")',
          )
          old_signature = "fn parse_typed_list<const N: usize>(raw: &[u8], expected: usize) -> Result<[RlpItem<'_>; N], Error> {\n    if expected != N || raw.first() != Some(&EIP1559_TYPE) {"
          new_signature = "fn parse_typed_list<const N: usize>(raw: &[u8]) -> Result<[RlpItem<'_>; N], Error> {\n    if raw.first() != Some(&EIP1559_TYPE) {"
          if old_signature not in text:
              raise SystemExit('expected parse_typed_list signature not found')
          text = text.replace(old_signature, new_signature)
          text = text.replace("impl RlpItem<'_> {", "impl<'a> RlpItem<'a> {")
          text = text.replace(
              'fn bytes_payload(self) -> Result<&[u8], Error> {',
              "fn bytes_payload(self) -> Result<&'a [u8], Error> {",
          )
          lib.write_text(text)

          example = Path('crates/chain-ethereum/examples/e2e.rs')
          text = example.read_text()
          start = text.index('    let sign_request = format!(')
          end = text.index('\n    let signed_by_anvil', start)
          replacement = '''    let sign_request = [
              "{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":1,\\\"method\\\":\\\"eth_signTransaction\\\",\\\"params\\\":[{\\\"type\\\":\\\"0x2\\\",\\\"from\\\":\\\"",
              FIRST_ACCOUNT,
              "\\\",\\\"to\\\":\\\"",
              SECOND_ACCOUNT,
              "\\\",\\\"nonce\\\":\\\"0x0\\\",\\\"value\\\":\\\"0x1\\\",\\\"gas\\\":\\\"0x5208\\\",\\\"maxPriorityFeePerGas\\\":\\\"0x3b9aca00\\\",\\\"maxFeePerGas\\\":\\\"0x77359400\\\",\\\"chainId\\\":\\\"0x7a69\\\",\\\"data\\\":\\\"0x\\\",\\\"accessList\\\":[]}]}"
          ]
          .concat();'''
          example.write_text(text[:start] + replacement + text[end:])

      - name: Format
        run: cargo fmt --all

      - name: Compile all targets
        run: cargo check --workspace --all-targets

      - name: Commit compiled patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chain-api crates/chain-bitcoin crates/chain-ethereum crates/chain-solana
          git commit -m 'Compile and format multi-chain execution'
          git push origin HEAD:main
