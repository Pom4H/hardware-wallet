name: Maintenance one-shot

on:
  push:
    paths:
      - .github/workflows/maintenance-one-shot.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply strict conversion
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/chain-solana/examples/e2e.rs')
          text = path.read_text()
          old = '        let mut carry = digit as u32;'
          new = '        let mut carry = u32::try_from(digit).expect("base58 alphabet index fits u32");'
          if old not in text:
              raise SystemExit('expected base58 cast not found')
          path.write_text(text.replace(old, new, 1))
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: no_std
        run: cargo check --workspace --no-default-features
      - name: Commit verified formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chain-solana .github/workflows/chains.yml
          git commit -m 'Verify and format Solana transfer adapter'
          git push origin HEAD:main
