name: Maintenance one-shot

on:
  push:
    paths:
      - .github/workflows/maintenance-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Preserve fixed-capacity no-heap enums
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/chain-ethereum/src/lib.rs')
          text = path.read_text()
          targets = [
              'pub enum Request {',
              'pub enum Review {',
              'pub enum Response {',
              'enum ExecutionKind {',
          ]
          marker = '#[allow(clippy::large_enum_variant)]\n'
          for target in targets:
              needle = target
              if marker + needle not in text:
                  if needle not in text:
                      raise SystemExit(f'missing target: {target}')
                  text = text.replace(needle, marker + needle, 1)
          path.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: no_std
        run: cargo check --workspace --no-default-features
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/chain-ethereum/src/lib.rs
          git commit -m 'Keep chain buffers heap-free under Clippy'
          git push origin HEAD:main
