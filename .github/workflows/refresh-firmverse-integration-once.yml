name: Refresh verified Firmverse integration once

on:
  push:
    paths:
      - .github/workflows/refresh-firmverse-integration-once.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-firmverse-integration-once
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Cortex-M toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: thumbv8m.main-none-eabi
          components: rustfmt, llvm-tools-preview

      - name: Install virtual hardware backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm gdb-multiarch

      - name: Wait for verified Firmverse backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/firmverse
          git clone https://github.com/Pom4H/firmverse.git /tmp/firmverse
          ready=0
          for attempt in $(seq 1 60); do
            git -C /tmp/firmverse fetch origin main
            git -C /tmp/firmverse reset --hard origin/main
            if grep -q 'FLASH_SECTION_PREFIXES' /tmp/firmverse/tools/cortex_m_probe.py \
              && test ! -f /tmp/firmverse/.github/workflows/finalize-cortex-probe-once.yml; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          echo "FIRMVERSE_SHA=$(git -C /tmp/firmverse rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Pin exact Firmverse commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          sha = os.environ["FIRMVERSE_SHA"]
          workflow = Path(".github/workflows/firmverse.yml")
          if not workflow.exists():
              raise SystemExit("Firmverse consumer workflow is missing")
          text = workflow.read_text()
          pattern = r"Pom4H/firmverse/actions/cortex-m-probe@[0-9a-f]{40}"
          replacement = f"Pom4H/firmverse/actions/cortex-m-probe@{sha}"
          updated, count = re.subn(pattern, replacement, text)
          if count != 1:
              raise SystemExit(f"expected exactly one Firmverse pin, found {count}")
          workflow.write_text(updated)
          PY

      - name: Link Firmverse execution image
        run: >-
          cargo +1.98.0 build
          --locked
          --profile firmware
          --target thumbv8m.main-none-eabi
          -p hardware-wallet-firmware-budget
          --features firmverse-probe

      - name: Execute wallet image through Firmverse
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc +1.98.0 -vV | sed -n 's/^host: //p')"
          llvm_root="$(rustc +1.98.0 --print sysroot)/lib/rustlib/${host}/bin"
          rm -rf reports/firmverse
          python3 /tmp/firmverse/tools/cortex_m_probe.py \
            --elf target/thumbv8m.main-none-eabi/firmware/hardware-wallet-firmware-budget \
            --target thumbv8m.main-none-eabi \
            --machine mps2-an505 \
            --cpu cortex-m33 \
            --ram-origin 0x20000000 \
            --ram-length 262144 \
            --flash-origin 0x00000000 \
            --flash-length 1048576 \
            --done-symbol firmverse_done \
            --stack-limit-bytes 32768 \
            --timeout-seconds 120 \
            --output-dir reports/firmverse \
            --llvm-nm "$llvm_root/llvm-nm" \
            --llvm-size "$llvm_root/llvm-size"

      - name: Update measured Firmverse baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("reports/firmverse/firmverse-report.json").read_text())
          assert report["status"] == "pass", report
          peak = report["peak_stack_bytes"]
          recommended = report["recommended_stack_bytes"]
          headroom = report["stack_headroom_bytes"]
          flash = report["flash_bytes"]
          static_ram = report["static_ram_bytes"]
          sha = os.environ["FIRMVERSE_SHA"]
          markdown = f'''# Firmverse execution baseline

Measured by `Pom4H/firmverse@{sha}` from the actual
`thumbv8m.main-none-eabi` ELF produced by this repository.

| Metric | Value |
| --- | ---: |
| Virtual board | `mps2-an505` / `cortex-m33` |
| Measured peak stack | {peak} B / {peak / 1024:.1f} KiB |
| Current stack gate | 32768 B / 32.0 KiB |
| Remaining headroom | {headroom} B / {headroom / 1024:.1f} KiB |
| Firmverse recommendation | {recommended} B / {recommended / 1024:.1f} KiB |
| Linked loadable Flash | {flash} B / {flash / 1024:.1f} KiB |
| Static RAM | {static_ram} B / {static_ram / 1024:.1f} KiB |
| Emulator wall time | {report["wall_time_ms"]} ms |
| ELF SHA-256 | `{report["elf_sha256"]}` |

Firmverse paints all free RAM before reset, executes the real Cortex-M33 image,
breaks at the non-inlined `firmverse_done` checkpoint, and scans the remaining
pattern. The result therefore includes actual compiler, BIP-39, HD derivation,
crypto and reducer stack frames reached by the current smoke scenario.

This is a measured lower bound, not yet the final product maximum. The 32 KiB
selection allowance remains in force until successful maximum-size Bitcoin,
Ethereum and Solana requests, USB/UI interrupt overlap, persistent commit and
firmware-update scenarios are modeled.

Cycle count is deliberately unresolved: {report["cycle_count_status"]}.
'''
          Path("docs/FIRMVERSE_BASELINE.md").write_text(markdown)
          PY

      - name: Verify all repository gates
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py'
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace
          cargo +1.98.0 check --locked --workspace --no-default-features

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/refresh-firmverse-integration-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Firmverse pin and baseline are already current"
          else
            git commit -m "Refresh Firmverse Cortex-M execution baseline"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload verified execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmverse-wallet-cortex-m33
          path: reports/firmverse
          if-no-files-found: error

      - name: Dispatch final gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yml hardware-budget.yml firmverse.yml; do
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              --data '{"ref":"main"}'
          done
