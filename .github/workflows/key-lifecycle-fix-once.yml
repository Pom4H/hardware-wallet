name: Key lifecycle cleanup once

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/key-lifecycle/src/lib.rs')
          s = p.read_text()
          s = s.replace(
              '    fn fill(&mut self, output: &mut [u8]) -> Result<(), Self::Error>;\n',
              '    /// # Errors\n    ///\n    /// Returns the hardware entropy source error if fresh random bytes cannot be produced.\n    fn fill(&mut self, output: &mut [u8]) -> Result<(), Self::Error>;\n',
              1,
          )
          s = s.replace(
              '    fn persist_root(&mut self, root: &[u8]) -> Result<(), Self::Error>;\n\n    fn load_root(',
              '    /// # Errors\n    ///\n    /// Returns a storage error if the root cannot be committed durably.\n    fn persist_root(&mut self, root: &[u8]) -> Result<(), Self::Error>;\n\n    /// # Errors\n    ///\n    /// Returns a storage error if the root cannot be read or authenticated.\n    fn load_root(',
              1,
          )
          s = s.replace(
              '    fn wipe_root(&mut self) -> Result<(), Self::Error>;\n',
              '    /// # Errors\n    ///\n    /// Returns a storage error if durable removal cannot be guaranteed.\n    fn wipe_root(&mut self) -> Result<(), Self::Error>;\n',
              1,
          )
          s = s.replace(
              '        core::str::from_utf8(&self.bytes[..usize::from(self.len)]).expect("ASCII is UTF-8")\n',
              '        core::str::from_utf8(&self.bytes[..usize::from(self.len)]).unwrap_or("")\n',
              1,
          )
          p.write_text(s)
          PY
          cargo fmt --all
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/key-lifecycle/src/lib.rs
          git commit -m "Document key lifecycle error contracts"
          git push
