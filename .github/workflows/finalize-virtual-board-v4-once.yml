name: Finalize virtual wallet board v4 once

on:
  push:
    paths:
      - .github/workflows/finalize-virtual-board-v4-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Integrate virtual board
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('crates/firmware-budget/Cargo.toml'); s=p.read_text().replace('firmverse-probe = ["embedded-probe", "dep:cortex-m-semihosting"]','firmverse-probe = ["embedded-probe"]').replace('cortex-m-semihosting = { version = "0.3.7", optional = true }\n',''); p.write_text(s)
          p=Path('crates/firmware-budget/src/virtual_device.rs'); s=p.read_text().replace('#[unsafe(no_mangle)]\n',''); s=s if '#[used]\n#[allow(non_upper_case_globals)]' in s else s.replace('#[allow(non_upper_case_globals)]\npub static firmverse_device_trace','#[used]\n#[allow(non_upper_case_globals)]\npub static firmverse_device_trace',1); p.write_text(s)
          p=Path('crates/firmware-budget/src/main.rs'); s=p.read_text(); a='use panic_halt as _;\n'; m='\n#[cfg(feature = "firmverse-probe")]\nmod virtual_device;\n'; s=s if 'mod virtual_device;' in s else s.replace(a,a+m,1)
          n='''#[entry]\nfn main() -> ! {\n    let selector = black_box(0x5a_u8);\n    #[cfg(feature = "firmverse-probe")] { black_box(virtual_device::run(selector)); firmverse_done(); }\n    #[cfg(not(feature = "firmverse-probe"))] { let result = exercise(selector); black_box(result); }\n    loop { cortex_m::asm::nop(); }\n}\n\n#[cfg(feature = "firmverse-probe")]\n#[inline(never)]\npub extern "C" fn firmverse_done() { cortex_m::asm::nop(); }\n\n'''
          if 'black_box(virtual_device::run(selector));' not in s:
              s,c=re.subn(r'#\[entry\]\nfn main\(\) -> ! \{.*?\n\}\n\n(?=#\[cfg\(feature = "firmverse-probe"\)\]\n#\[inline\(never\)\]\nfn firmverse_self_test)',n,s,count=1,flags=re.S); assert c==1
          s=s.replace('#[unsafe(no_mangle)]\n',''); p.write_text(s)
          p=Path('crates/firmware-budget/build.rs'); s=p.read_text(); old='    fs::write(output.join("memory.x"), include_bytes!("memory.x"))\n        .expect("write generic probe memory layout");'; new='''    if env::var_os("CARGO_FEATURE_FIRMVERSE_PROBE").is_some() {\n        fs::write(output.join("memory.x"), b"MEMORY\\n{\\n  FLASH : ORIGIN = 0x10000000, LENGTH = 1024K\\n  RAM   : ORIGIN = 0x38000000, LENGTH = 256K\\n}\\n\\n_stack_start = ORIGIN(RAM) + LENGTH(RAM);\\n").expect("write Firmverse secure memory layout");\n    } else { fs::write(output.join("memory.x"), include_bytes!("memory.x")).expect("write generic probe memory layout"); }'''
          if 'write Firmverse secure memory layout' not in s: assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: thumbv8m.main-none-eabi
          components: rustfmt, llvm-tools-preview
      - name: Install runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-system-arm gdb-multiarch
      - name: Build and execute
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 build --locked --profile firmware --target thumbv8m.main-none-eabi -p hardware-wallet-firmware-budget --features firmverse-probe
          rm -rf /tmp/firmverse reports/firmverse
          git clone --quiet https://github.com/Pom4H/firmverse.git /tmp/firmverse
          git -C /tmp/firmverse checkout --quiet 819c9bd3716f73a3973ecf94033e92434ebef587
          host="$(rustc +1.98.0 -vV | sed -n 's/^host: //p')"; llvm_root="$(rustc +1.98.0 --print sysroot)/lib/rustlib/${host}/bin"
          python3 /tmp/firmverse/tools/cortex_m_probe.py --elf target/thumbv8m.main-none-eabi/firmware/hardware-wallet-firmware-budget --target thumbv8m.main-none-eabi --machine mps2-an505 --cpu cortex-m33 --ram-origin 0x38000000 --ram-length 262144 --flash-origin 0x10000000 --flash-length 1048576 --done-symbol firmverse_done --device-trace-symbol firmverse_device_trace --required-device-capabilities 0x1f --stack-limit-bytes 32768 --timeout-seconds 120 --output-dir reports/firmverse --llvm-nm "$llvm_root/llvm-nm" --llvm-size "$llvm_root/llvm-size"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/firmverse/firmverse-report.json').read_text()); t=r['device_trace']
          assert r['status']=='pass' and t['status']=='pass' and t['capabilities']==31
          assert t['button_events']==3 and t['display_frames']==2 and t['display_digest']
          assert t['trng_bytes']==32 and t['trng_digest']
          assert t['storage_commits']==2 and t['storage_generation']==2 and t['storage_digest']
          assert t['secure_element_ops']==1 and t['secure_element_digest'] and t['failure_code']==0
          PY
      - name: Verify all repository gates
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace
          cargo +1.98.0 check --locked --workspace --no-default-features
      - name: Commit implementation
        run: |
          set -euo pipefail
          git checkout -- .github/workflows
          rm -f virtual-board-build.log firmverse-symbols.log firmverse-exec.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A Cargo.lock crates/firmware-budget virtual-board-build.log firmverse-symbols.log firmverse-exec.log
          git diff --cached --quiet && exit 0
          git commit -m "Run wallet firmware on deterministic virtual hardware"
          git pull --rebase origin main
          git push origin main
