name: Fix hardware budget linker once

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix linker and probe warnings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('crates/firmware-budget/src/main.rs')
          source = main.read_text()
          source = source.replace(
              '            black_box(execution.next(None));',
              '            let _ = black_box(execution.next(None));',
          )
          main.write_text(source)

          build = Path('crates/firmware-budget/build.rs')
          source = build.read_text()
          needle = '    println!("cargo:rustc-link-search={}", output.display());\n'
          replacement = (
              needle
              + '    println!(\n'
              + '        "cargo:rustc-link-arg-bin=hardware-wallet-firmware-budget=-Tlink.x"\n'
              + '    );\n'
          )
          if needle not in source:
              raise SystemExit('missing build.rs link-search line')
          build.write_text(source.replace(needle, replacement, 1))
          PY
          cargo fmt --all
          rm .github/workflows/fix-budget-linker-once.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Link hardware budget probe with Cortex-M layout"
          git push
