name: Finalize virtual wallet board v2 once

on:
  push:
    paths:
      - .github/workflows/finalize-virtual-board-v2-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Integrate virtual board without unsafe exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          cargo_path = Path('crates/firmware-budget/Cargo.toml')
          cargo = cargo_path.read_text()
          cargo = cargo.replace('firmverse-probe = ["embedded-probe", "dep:cortex-m-semihosting"]', 'firmverse-probe = ["embedded-probe"]')
          cargo = cargo.replace('cortex-m-semihosting = { version = "0.3.7", optional = true }\n', '')
          cargo_path.write_text(cargo)

          device_path = Path('crates/firmware-budget/src/virtual_device.rs')
          device = device_path.read_text().replace('#[unsafe(no_mangle)]\n', '')
          device_path.write_text(device)

          main_path = Path('crates/firmware-budget/src/main.rs')
          source = main_path.read_text()
          if 'mod virtual_device;' not in source:
              source = source.replace('use panic_halt as _;\n', 'use panic_halt as _;\n\n#[cfg(feature = "firmverse-probe")]\nmod virtual_device;\n', 1)
          replacement = '''#[entry]
          fn main() -> ! {
              let selector = black_box(0x5a_u8);
              #[cfg(feature = "firmverse-probe")]
              {
                  black_box(virtual_device::run(selector));
                  firmverse_done();
              }
              #[cfg(not(feature = "firmverse-probe"))]
              {
                  let result = exercise(selector);
                  black_box(result);
              }
              loop {
                  cortex_m::asm::nop();
              }
          }

          #[cfg(feature = "firmverse-probe")]
          #[inline(never)]
          pub extern "C" fn firmverse_done() {
              cortex_m::asm::nop();
          }

          '''
          if 'black_box(virtual_device::run(selector));' not in source:
              source, count = re.subn(
                  r'#\[entry\]\nfn main\(\) -> ! \{.*?\n\}\n\n(?=#\[cfg\(feature = "firmverse-probe"\)\]\n#\[inline\(never\)\]\nfn firmverse_self_test)',
                  replacement,
                  source,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'entrypoint replacement count={count}')
          source = source.replace('#[unsafe(no_mangle)]\n', '')
          main_path.write_text(source)

          build_path = Path('crates/firmware-budget/build.rs')
          build = build_path.read_text()
          if 'write Firmverse secure memory layout' not in build:
              old = '    fs::write(output.join("memory.x"), include_bytes!("memory.x"))\n        .expect("write generic probe memory layout");'
              new = '''    if env::var_os("CARGO_FEATURE_FIRMVERSE_PROBE").is_some() {
                  fs::write(
                      output.join("memory.x"),
                      b"MEMORY\\n{\\n  FLASH : ORIGIN = 0x10000000, LENGTH = 1024K\\n  RAM   : ORIGIN = 0x38000000, LENGTH = 256K\\n}\\n\\n_stack_start = ORIGIN(RAM) + LENGTH(RAM);\\n",
                  )
                  .expect("write Firmverse secure memory layout");
              } else {
                  fs::write(output.join("memory.x"), include_bytes!("memory.x"))
                      .expect("write generic probe memory layout");
              }'''
              if old not in build:
                  raise SystemExit('memory writer anchor missing')
              build = build.replace(old, new, 1)
          build_path.write_text(build)
          PY

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: thumbv8m.main-none-eabi
          components: rustfmt, llvm-tools-preview

      - name: Install QEMU and GDB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm gdb-multiarch

      - name: Build Cortex-M33 firmware
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 build --locked --profile firmware --target thumbv8m.main-none-eabi -p hardware-wallet-firmware-budget --features firmverse-probe

      - name: Execute and validate FVD1
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/Pom4H/firmverse.git /tmp/firmverse
          git -C /tmp/firmverse checkout --quiet 819c9bd3716f73a3973ecf94033e92434ebef587
          host="$(rustc +1.98.0 -vV | sed -n 's/^host: //p')"
          llvm_root="$(rustc +1.98.0 --print sysroot)/lib/rustlib/${host}/bin"
          python3 /tmp/firmverse/tools/cortex_m_probe.py \
            --elf target/thumbv8m.main-none-eabi/firmware/hardware-wallet-firmware-budget \
            --target thumbv8m.main-none-eabi --machine mps2-an505 --cpu cortex-m33 \
            --ram-origin 0x38000000 --ram-length 262144 \
            --flash-origin 0x10000000 --flash-length 1048576 \
            --done-symbol firmverse_done \
            --device-trace-symbol firmverse_device_trace \
            --required-device-capabilities 0x1f \
            --stack-limit-bytes 32768 --timeout-seconds 120 \
            --output-dir reports/firmverse \
            --llvm-nm "$llvm_root/llvm-nm" --llvm-size "$llvm_root/llvm-size"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/firmverse/firmverse-report.json').read_text())
          trace=report['device_trace']
          assert report['status']=='pass'
          assert trace['status']=='pass'
          assert trace['capabilities']==31
          assert trace['button_events']==3
          assert trace['display_frames']==2 and trace['display_digest']
          assert trace['trng_bytes']==32 and trace['trng_digest']
          assert trace['storage_commits']==2 and trace['storage_generation']==2 and trace['storage_digest']
          assert trace['secure_element_ops']==1 and trace['secure_element_digest']
          assert trace['failure_code']==0
          PY

      - name: Verify normal repository gates
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace
          cargo +1.98.0 check --locked --workspace --no-default-features

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows
          rm -f virtual-board-build.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A Cargo.lock crates/firmware-budget virtual-board-build.log
          git diff --cached --quiet && exit 0
          git commit -m "Run wallet firmware on deterministic virtual hardware"
          git pull --rebase origin main
          git push origin main
