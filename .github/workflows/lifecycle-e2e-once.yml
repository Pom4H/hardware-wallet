name: Lifecycle E2E migration once

on:
  push:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Migrate chain E2Es to entropy lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          examples = [
              ('bitcoin', 'Secp256k1Bip32'),
              ('ethereum', 'Secp256k1Bip32'),
              ('solana', 'Ed25519Slip10'),
          ]

          for chain, family in examples:
              p = Path(f'crates/chain-{chain}/examples/{chain}_e2e.rs')
              s = p.read_text()
              s = s.replace(
                  'use hardware_wallet_hd_key_backend::{HdKeyBackend, KeyFamily};\n',
                  'use hardware_wallet_hd_key_backend::{HdKeyBackend, KeyFamily};\n'
                  'use hardware_wallet_key_lifecycle::{KeyLifecycle, MnemonicSize, NormalizedPassphrase};\n'
                  'use hardware_wallet_key_lifecycle::test_utils::{FixedEntropySource, MemorySecretStore};\n',
                  1,
              )
              s = s.replace('const TEST_SEED: [u8; 32] = [', 'const TEST_ENTROPY: [u8; 32] = [', 1)
              old = (
                  '    let context = unlocked_context();\n'
                  '    let target = key_target();\n'
                  '    let locator = context.bind_key(target);\n'
                  f'    let hd = HdKeyBackend::new(account_descriptor(), KeyFamily::{family}, &TEST_SEED)\n'
                  '        .expect("HD backend");\n'
              )
              new = (
                  '    let mut lifecycle = KeyLifecycle::new(\n'
                  '        MemorySecretStore::new(),\n'
                  '        FixedEntropySource::new(TEST_ENTROPY),\n'
                  '    );\n'
                  '    lifecycle\n'
                  '        .begin_create(MnemonicSize::Words24)\n'
                  '        .expect("device entropy creates BIP39 wallet");\n'
                  '    lifecycle\n'
                  '        .commit_pending()\n'
                  '        .expect("provisioning persists root entropy");\n'
                  '    let wallet = lifecycle\n'
                  '        .open_context(&NormalizedPassphrase::empty())\n'
                  '        .expect("open base wallet context");\n\n'
                  '    let context = unlocked_context(wallet.id());\n'
                  '    let target = key_target();\n'
                  '    let locator = context.bind_key(target);\n'
                  f'    let hd = HdKeyBackend::new(account_descriptor(wallet.id()), KeyFamily::{family}, wallet.seed())\n'
                  '        .expect("HD backend");\n'
              )
              if old not in s:
                  raise SystemExit(f'missing main block in {chain}')
              s = s.replace(old, new, 1)
              s = s.replace(
                  'fn account_descriptor() -> AccountDescriptor {\n',
                  'fn account_descriptor(wallet: WalletContextId) -> AccountDescriptor {\n',
                  1,
              )
              s = s.replace('        wallet: WalletContextId(4),\n', '        wallet,\n', 1)
              s = s.replace(
                  'fn unlocked_context() -> hardware_wallet_core::ExecutionContext {\n',
                  'fn unlocked_context(wallet: WalletContextId) -> hardware_wallet_core::ExecutionContext {\n',
                  1,
              )
              marker = '            wallet: WalletContextId(4),\n'
              if marker not in s:
                  raise SystemExit(f'missing session wallet in {chain}')
              s = s.replace(marker, '            wallet,\n', 1)
              p.write_text(s)

              cargo = Path(f'crates/chain-{chain}/Cargo.toml')
              c = cargo.read_text()
              dep = 'hardware-wallet-key-lifecycle = { path = "../key-lifecycle", features = ["test-utils"] }\n'
              if dep not in c:
                  needle = 'hardware-wallet-hd-key-backend = { path = "../hd-key-backend" }\n'
                  if needle not in c:
                      raise SystemExit(f'missing HD dev dependency in {chain}')
                  c = c.replace(needle, needle + dep, 1)
              cargo.write_text(c)
          PY
          cargo fmt --all
      - name: Commit migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/chain-bitcoin crates/chain-ethereum crates/chain-solana
          git commit -m "Drive chain E2E from BIP39 entropy lifecycle"
          git push
