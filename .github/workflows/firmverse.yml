name: Firmverse

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/firmverse.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/firmverse.yml

permissions:
  contents: read

jobs:
  virtual-hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Rust Cortex-M toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: thumbv8m.main-none-eabi
          components: llvm-tools-preview

      - name: Build real wallet firmware
        run: |
          cargo +1.98.0 build \
            --locked \
            --profile firmware \
            --target thumbv8m.main-none-eabi \
            -p hardware-wallet-firmware-budget \
            --features firmverse-probe

      - name: Execute on virtual Cortex-M33 hardware
        id: firmverse
        uses: Pom4H/firmverse/actions/cortex-m-probe@819c9bd3716f73a3973ecf94033e92434ebef587
        with:
          elf: target/thumbv8m.main-none-eabi/firmware/hardware-wallet-firmware-budget
          target: thumbv8m.main-none-eabi
          machine: mps2-an505
          cpu: cortex-m33
          ram-origin: "0x38000000"
          ram-length: "262144"
          flash-origin: "0x10000000"
          flash-length: "1048576"
          done-symbol: firmverse_done
          device-trace-symbol: firmverse_device_trace
          required-device-capabilities: "0x1f"
          stack-limit-bytes: "32768"
          output-dir: reports/firmverse

      - name: Assert wallet virtual hardware contract
        env:
          REPORT_JSON: ${{ steps.firmverse.outputs.report-json }}
          DEVICE_STATUS: ${{ steps.firmverse.outputs.device-status }}
          DEVICE_CAPABILITIES: ${{ steps.firmverse.outputs.device-capabilities }}
        run: |
          set -euo pipefail
          test "$DEVICE_STATUS" = pass
          test "$DEVICE_CAPABILITIES" = 31
          python3 - "$REPORT_JSON" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          trace = report["device_trace"]
          assert report["status"] == "pass"
          assert trace["button_events"] == 3
          assert trace["display_frames"] == 2 and trace["display_digest"] != 0
          assert trace["trng_bytes"] == 32 and trace["trng_digest"] != 0
          assert trace["storage_commits"] == 2
          assert trace["storage_generation"] == 2
          assert trace["storage_digest"] != 0
          assert trace["secure_element_ops"] == 1
          assert trace["secure_element_digest"] != 0
          assert trace["failure_code"] == 0
          PY

      - name: Upload execution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmverse-wallet-report
          path: reports/firmverse
          if-no-files-found: error
