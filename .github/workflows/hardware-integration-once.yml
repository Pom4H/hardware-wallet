name: Hardware integration migration once

on:
  push:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: thumbv7em-none-eabi
          components: rustfmt
      - name: Add strict Firmverse execution harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo_path = Path('crates/firmware-budget/Cargo.toml')
          cargo = cargo_path.read_text()
          cargo = cargo.replace(
              'embedded-probe = []\n',
              'embedded-probe = []\nfirmverse-probe = ["embedded-probe", "dep:cortex-m-semihosting"]\n',
              1,
          )
          cargo = cargo.replace(
              'cortex-m-rt = "0.7"\n',
              'cortex-m-rt = "0.7"\ncortex-m-semihosting = { version = "0.3.7", optional = true }\n',
              1,
          )
          cargo_path.write_text(cargo)

          main_path = Path('crates/firmware-budget/src/main.rs')
          source = main_path.read_text()
          source = source.replace(
              'BoundedBytes, ChainExecution, ChainModule, CryptoOperation, HashAlgorithm, PayloadId,\n',
              'BoundedBytes, ChainExecution, ChainModule, CryptoOperation, CryptoOutput, HashAlgorithm,\n    PayloadId,\n',
              1,
          )
          old_main = '''#[entry]
          fn main() -> ! {
              let selector = black_box(0x5a_u8);
              let result = exercise(selector);
              black_box(result);

              loop {
                  cortex_m::asm::nop();
              }
          }
          '''
          new_main = '''#[entry]
          fn main() -> ! {
              let selector = black_box(0x5a_u8);

              #[cfg(feature = "firmverse-probe")]
              let success = firmverse_self_test(selector);

              #[cfg(not(feature = "firmverse-probe"))]
              {
                  let result = exercise(selector);
                  black_box(result);
              }

              #[cfg(feature = "firmverse-probe")]
              cortex_m_semihosting::debug::exit(if success {
                  cortex_m_semihosting::debug::EXIT_SUCCESS
              } else {
                  cortex_m_semihosting::debug::EXIT_FAILURE
              });

              loop {
                  cortex_m::asm::nop();
              }
          }
          '''
          if old_main not in source:
              raise SystemExit('firmware-budget main block changed unexpectedly')
          source = source.replace(old_main, new_main, 1)

          marker = '#[inline(never)]\nfn exercise(selector: u8) -> u32 {'
          self_test = '''#[cfg(feature = "firmverse-probe")]
          #[inline(never)]
          fn firmverse_self_test(selector: u8) -> bool {
              let mut lifecycle = KeyLifecycle::new(ProbeStore::new(), ProbeEntropy::new(selector));
              if lifecycle.begin_create(MnemonicSize::Words24).is_err()
                  || lifecycle.commit_pending().is_err()
              {
                  return false;
              }

              let passphrase = match NormalizedPassphrase::from_ascii("firmverse-hardware") {
                  Ok(value) => value,
                  Err(_) => return false,
              };
              let wallet = match lifecycle.open_context(&passphrase) {
                  Ok(value) => value,
                  Err(_) => return false,
              };
              let context = match unlocked_context(wallet.id(), selector | 1) {
                  Some(value) => value,
                  None => return false,
              };

              let secp_target = key_target(AccountId(1), selector, false);
              let secp_locator = context.bind_key(secp_target);
              let secp_hd = match HdKeyBackend::new(
                  account_descriptor(wallet.id(), AccountId(1), false),
                  KeyFamily::Secp256k1Bip32,
                  wallet.seed(),
              ) {
                  Ok(value) => value,
                  Err(_) => return false,
              };
              let secp_backend = match secp_hd.software_backend(secp_locator) {
                  Ok(value) => value,
                  Err(_) => return false,
              };
              let secp_runtime = CryptoRuntime::new(secp_backend);
              let secp_payload = [selector; 96];

              let secp_public = secp_runtime.execute(
                  CryptoOperation::DerivePublicKey {
                      key: secp_locator,
                      format: PublicKeyFormat::Compressed,
                  },
                  None,
              );
              if !matches!(
                  secp_public,
                  Ok(CryptoOutput::PublicKey { ref bytes, .. }) if bytes.len() == 33
              ) {
                  return false;
              }
              let secp_digest = secp_runtime.execute(
                  CryptoOperation::Hash {
                      algorithm: HashAlgorithm::Sha256,
                      payload: PayloadId(0xF100_0001),
                  },
                  Some(&secp_payload),
              );
              if !matches!(
                  secp_digest,
                  Ok(CryptoOutput::Digest { ref bytes, .. }) if bytes.len() == 32
              ) {
                  return false;
              }
              let secp_signature = secp_runtime.execute(
                  CryptoOperation::Sign {
                      key: secp_locator,
                      scheme: SignatureScheme::Ecdsa {
                          curve: Curve::Secp256k1,
                          recoverable: true,
                      },
                      prehash: HashAlgorithm::Sha256,
                      payload: PayloadId(0xF100_0002),
                  },
                  Some(&secp_payload),
              );
              if !matches!(
                  secp_signature,
                  Ok(CryptoOutput::Signature { ref bytes, .. }) if bytes.len() == 64
              ) {
                  return false;
              }

              let ed_target = key_target(AccountId(2), selector, true);
              let ed_locator = context.bind_key(ed_target);
              let ed_hd = match HdKeyBackend::new(
                  account_descriptor(wallet.id(), AccountId(2), true),
                  KeyFamily::Ed25519Slip10,
                  wallet.seed(),
              ) {
                  Ok(value) => value,
                  Err(_) => return false,
              };
              let ed_backend = match ed_hd.software_backend(ed_locator) {
                  Ok(value) => value,
                  Err(_) => return false,
              };
              let ed_runtime = CryptoRuntime::new(ed_backend);
              let ed_payload = [selector.wrapping_add(1); 96];

              let ed_public = ed_runtime.execute(
                  CryptoOperation::DerivePublicKey {
                      key: ed_locator,
                      format: PublicKeyFormat::Raw,
                  },
                  None,
              );
              if !matches!(
                  ed_public,
                  Ok(CryptoOutput::PublicKey { ref bytes, .. }) if bytes.len() == 32
              ) {
                  return false;
              }
              let ed_signature = ed_runtime.execute(
                  CryptoOperation::Sign {
                      key: ed_locator,
                      scheme: SignatureScheme::Ed25519,
                      prehash: HashAlgorithm::None,
                      payload: PayloadId(0xF100_0003),
                  },
                  Some(&ed_payload),
              );
              if !matches!(
                  ed_signature,
                  Ok(CryptoOutput::Signature { ref bytes, .. }) if bytes.len() == 64
              ) {
                  return false;
              }

              drop(ed_runtime);
              drop(ed_hd);
              drop(secp_runtime);
              drop(secp_hd);
              drop(wallet);
              lifecycle.wipe().is_ok()
          }

          '''
          if marker not in source:
              raise SystemExit('exercise marker changed unexpectedly')
          source = source.replace(marker, self_test + marker, 1)
          main_path.write_text(source)
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 build \
            --locked \
            --profile firmware \
            --target thumbv7em-none-eabi \
            -p hardware-wallet-firmware-budget \
            --features firmverse-probe
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/firmware-budget
          git commit -m "Run strict key lifecycle probe under Firmverse"
          git push
