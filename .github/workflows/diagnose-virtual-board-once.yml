name: Diagnose virtual board once

on:
  push:
    paths:
      - .github/workflows/diagnose-virtual-board-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply integration patch
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('crates/firmware-budget/Cargo.toml'); s=p.read_text().replace('firmverse-probe = ["embedded-probe", "dep:cortex-m-semihosting"]','firmverse-probe = ["embedded-probe"]').replace('cortex-m-semihosting = { version = "0.3.7", optional = true }\n',''); p.write_text(s)
          p=Path('crates/firmware-budget/src/main.rs'); s=p.read_text(); a='use panic_halt as _;\n'; m='\n#[cfg(feature = "firmverse-probe")]\nmod virtual_device;\n'; s=s if 'mod virtual_device;' in s else s.replace(a,a+m,1)
          n='''#[entry]\nfn main() -> ! {\n    let selector = black_box(0x5a_u8);\n    #[cfg(feature = "firmverse-probe")]\n    { black_box(virtual_device::run(selector)); firmverse_done(); }\n    #[cfg(not(feature = "firmverse-probe"))]\n    { let result = exercise(selector); black_box(result); }\n    loop { cortex_m::asm::nop(); }\n}\n\n#[cfg(feature = "firmverse-probe")]\n#[unsafe(no_mangle)]\n#[inline(never)]\npub extern "C" fn firmverse_done() { cortex_m::asm::nop(); }\n\n'''
          s,c=re.subn(r'#\[entry\]\nfn main\(\) -> ! \{.*?\n\}\n\n(?=#\[cfg\(feature = "firmverse-probe"\)\]\n#\[inline\(never\)\]\nfn firmverse_self_test)',n,s,count=1,flags=re.S); assert c==1; p.write_text(s)
          p=Path('crates/firmware-budget/build.rs'); s=p.read_text(); old='    fs::write(output.join("memory.x"), include_bytes!("memory.x"))\n        .expect("write generic probe memory layout");'; new='''    if env::var_os("CARGO_FEATURE_FIRMVERSE_PROBE").is_some() {\n        fs::write(output.join("memory.x"), b"MEMORY\\n{\\n  FLASH : ORIGIN = 0x10000000, LENGTH = 1024K\\n  RAM   : ORIGIN = 0x38000000, LENGTH = 256K\\n}\\n\\n_stack_start = ORIGIN(RAM) + LENGTH(RAM);\\n").expect("write Firmverse secure memory layout");\n    } else {\n        fs::write(output.join("memory.x"), include_bytes!("memory.x")).expect("write generic probe memory layout");\n    }'''; assert old in s; p.write_text(s.replace(old,new,1))
          PY
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: thumbv8m.main-none-eabi
      - name: Build and persist failure log
        shell: bash
        run: |
          set +e
          cargo +1.98.0 build --profile firmware --target thumbv8m.main-none-eabi -p hardware-wallet-firmware-budget --features firmverse-probe > virtual-board-build.log 2>&1
          rc=$?
          cat virtual-board-build.log
          if [ "$rc" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add virtual-board-build.log
            git commit -m "Capture virtual board build failure"
            git push origin main
            exit "$rc"
          fi
