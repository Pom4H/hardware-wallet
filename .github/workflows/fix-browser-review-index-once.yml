name: Fix browser wallet review cursor once

on:
  push:
    paths:
      - .github/workflows/fix-browser-review-index-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: thumbv6m-none-eabi
          components: rustfmt, llvm-tools-preview
      - name: Add missing review cursor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('demos/browser-wallet/src/lib.rs')
          source=path.read_text()
          source=source.replace('    power_index: u8,\n    control_index: u8,\n','    power_index: u8,\n    review_index: u8,\n    control_index: u8,\n',1)
          source=source.replace('            power_index: 0,\n            control_index: 0,\n','            power_index: 0,\n            review_index: 0,\n            control_index: 0,\n',1)
          path.write_text(source)
          PY
      - name: Verify host and Cortex-M builds
        run: |
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test --locked --workspace
          bash tools/build_browser_wallet_demo.sh
      - name: Commit and remove trigger
        run: |
          rm .github/workflows/fix-browser-review-index-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix browser wallet review cursor"
          git pull --rebase origin main
          git push origin main
